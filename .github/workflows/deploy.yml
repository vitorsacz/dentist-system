name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to promote (default: HEAD of main)'
        required: false
        default: ''

# Um único gate de promoção por vez; não cancela em andamento.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    name: Promote → production
    runs-on: ubuntu-latest
    # Pausa aqui para aprovação do environment "prod".
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve SHA
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if [ -n "$INPUT_SHA" ]; then
            if ! echo "$INPUT_SHA" | grep -qE '^[0-9a-f]{40}$'; then
              echo "ERROR: sha deve ser um hash hexadecimal de 40 caracteres (got: $INPUT_SHA)"
              exit 1
            fi
            SHA="$INPUT_SHA"
          else
            SHA=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA: $SHA"

      - name: Verify SHA is ancestor of origin/main
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "ERROR: $SHA não é ancestral de origin/main — só SHAs da main podem ser promovidos"
            exit 1
          fi
          echo "$SHA é ancestral de origin/main — OK"

      - name: Verify CI check 'build' is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          CONCLUSION=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "build")] | .[0].conclusion')
          echo "build: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "ERROR: check 'build' not green for $SHA (got: $CONCLUSION)"
            exit 1
          fi

      - name: Verify Vercel status checks are green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          for CTX in "Vercel – dentist-system-web" "Vercel – dentist-system-web-hml"; do
            STATE=$(gh api "repos/${{ github.repository }}/commits/$SHA/status" \
              | jq -r --arg c "$CTX" '.statuses[] | select(.context == $c) | .state' | head -1)
            echo "$CTX: $STATE"
            if [ "$STATE" != "success" ]; then
              echo "ERROR: Vercel check '$CTX' not green for $SHA (got: $STATE)"
              exit 1
            fi
          done

      - name: Smoke HML — wait for version prefix==SHA and appEnv==hml
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          HML_URL="${{ vars.HML_API_URL }}"
          DEADLINE=$((SECONDS + 600))
          WAIT=10
          while true; do
            RESP=$(curl --silent --max-time 10 "$HML_URL/health" 2>/dev/null || echo '{}')
            VERSION=$(echo "$RESP" | jq -r '.version // empty')
            APPENV=$(echo "$RESP" | jq -r '.appEnv // empty')
            echo "$(date -u +%T)  version=$VERSION  appEnv=$APPENV"
            if [ -n "$VERSION" ] && [[ "$SHA" == "$VERSION"* ]] && [ "$APPENV" = "hml" ]; then
              echo "HML smoke test passed."
              break
            fi
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "ERROR: HML smoke test timed out after 10 min. Last response: $RESP"
              exit 1
            fi
            sleep $WAIT
            # Backoff exponencial até 60 s (serviço free do Render pode hibernar).
            WAIT=$(( WAIT < 60 ? WAIT * 2 : 60 ))
          done

      - name: Advance production branch
        id: advance
        run: |
          SHA="${{ steps.sha.outputs.sha }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PREV_SHA=$(git ls-remote origin refs/heads/production | cut -f1)
          echo "prev_sha=${PREV_SHA:-none}" >> "$GITHUB_OUTPUT"

          if [ -n "$PREV_SHA" ]; then
            # SHA deve ser descendente de production (fast-forward obrigatório).
            if ! git merge-base --is-ancestor "$PREV_SHA" "$SHA"; then
              echo "ERROR: $SHA não é descendente de production ($PREV_SHA). Para rollback use o painel do Render/Vercel ou crie um revert commit na main."
              exit 1
            fi
          fi

          git push origin "$SHA:refs/heads/production"
          echo "production → $SHA (era: ${PREV_SHA:-none})"

      - name: Wait for prod — version prefix==SHA and appEnv==prod
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          PROD_URL="${{ vars.PROD_API_URL }}"
          DEADLINE=$((SECONDS + 600))
          WAIT=15
          while true; do
            RESP=$(curl --silent --max-time 10 "$PROD_URL/health" 2>/dev/null || echo '{}')
            VERSION=$(echo "$RESP" | jq -r '.version // empty')
            APPENV=$(echo "$RESP" | jq -r '.appEnv // empty')
            echo "$(date -u +%T)  version=$VERSION  appEnv=$APPENV"
            if [ -n "$VERSION" ] && [[ "$SHA" == "$VERSION"* ]] && [ "$APPENV" = "prod" ]; then
              echo "Prod health check passed."
              break
            fi
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "ERROR: prod health check timed out after 10 min. Last response: $RESP"
              exit 1
            fi
            sleep $WAIT
            WAIT=$(( WAIT < 60 ? WAIT * 2 : 60 ))
          done

      - name: Job summary
        if: always()
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          PREV="${{ steps.advance.outputs.prev_sha }}"
          {
            echo "## Promoção"
            echo ""
            echo "| | SHA |"
            echo "|---|---|"
            echo "| **Promovido para** | \`$SHA\` |"
            echo "| **Anterior (rollback ref)** | \`$PREV\` |"
          } >> "$GITHUB_STEP_SUMMARY"
