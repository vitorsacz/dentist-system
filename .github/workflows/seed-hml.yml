name: Seed HML

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: hml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - name: Gerar Prisma Client
        run: pnpm --filter @dentist-system/api prisma generate

      - name: Executar seed HML
        run: pnpm --filter @dentist-system/api db:seed
        env:
          APP_ENV: hml
          DATABASE_URL: ${{ secrets.HML_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.HML_DIRECT_URL }}
          SEED_HML_PASSWORD: ${{ secrets.SEED_HML_PASSWORD }}
